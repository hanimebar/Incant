<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect fill="#0f0a2e" width="32" height="32"/>

  <!-- Hat body: deep indigo, taller than Apprentice -->
  <g fill="#3730a3">
    <rect x="15" y="2"  width="2"  height="1"/>
    <rect x="14" y="3"  width="4"  height="1"/>
    <rect x="13" y="4"  width="6"  height="1"/>
    <rect x="12" y="5"  width="8"  height="1"/>
    <rect x="11" y="6"  width="10" height="1"/>
    <rect x="10" y="7"  width="12" height="1"/>
    <rect x="9"  y="8"  width="14" height="1"/>
    <rect x="8"  y="9"  width="16" height="1"/>
    <rect x="8"  y="10" width="16" height="1"/>
    <rect x="7"  y="11" width="18" height="1"/>
  </g>

  <!-- Glowing gold tip (top 2 rows overdrawn) -->
  <g fill="#f5c518">
    <rect x="15" y="2" width="2" height="1"/>
    <rect x="14" y="3" width="4" height="1"/>
  </g>

  <!-- Hat band -->
  <rect fill="#4338ca" x="7" y="12" width="18" height="1"/>

  <!-- Brim: bright indigo, narrower on right to leave room for wand -->
  <rect fill="#4f46e5" x="4" y="13" width="19" height="2"/>

  <!-- Wand shaft: dark brown, vertical, right of brim -->
  <rect fill="#713f12" x="23" y="13" width="2" height="14"/>

  <!-- Wand star tip: gold cross above wand shaft -->
  <g fill="#f5c518">
    <rect x="24" y="9"  width="1" height="1"/>
    <rect x="22" y="10" width="5" height="1"/>
    <rect x="24" y="11" width="1" height="1"/>
    <rect x="24" y="12" width="1" height="1"/>
  </g>

  <!-- Sparkle stars scattered around (gold) -->
  <g fill="#f5c518">
    <rect x="4"  y="5"  width="1" height="1"/>
    <rect x="28" y="4"  width="1" height="1"/>
    <rect x="5"  y="10" width="1" height="1"/>
    <rect x="30" y="8"  width="1" height="1"/>
    <rect x="27" y="15" width="1" height="1"/>
    <rect x="2"  y="13" width="1" height="1"/>
  </g>

  <!-- Cyan sparkles for extra magic -->
  <g fill="#67e8f9">
    <rect x="6"  y="7"  width="1" height="1"/>
    <rect x="29" y="11" width="1" height="1"/>
    <rect x="26" y="6"  width="1" height="1"/>
  </g>
</svg>
