<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect fill="#0f0a2e" width="32" height="32"/>

  <!-- Hat body: dark purple, cone widening from tip -->
  <g fill="#4c1d95">
    <rect x="15" y="3"  width="2"  height="1"/>
    <rect x="14" y="4"  width="4"  height="1"/>
    <rect x="13" y="5"  width="6"  height="1"/>
    <rect x="12" y="6"  width="8"  height="1"/>
    <rect x="11" y="7"  width="10" height="1"/>
    <rect x="10" y="8"  width="12" height="1"/>
    <rect x="9"  y="9"  width="14" height="1"/>
    <rect x="8"  y="10" width="16" height="1"/>
    <rect x="8"  y="11" width="16" height="1"/>
    <rect x="7"  y="12" width="18" height="1"/>
  </g>

  <!-- Hat band: slightly lighter stripe -->
  <rect fill="#6d28d9" x="7" y="13" width="18" height="1"/>

  <!-- Brim: medium purple, wider than hat base -->
  <rect fill="#7c3aed" x="4" y="14" width="24" height="2"/>

  <!-- Star badge (diamond) on hat, gold -->
  <g fill="#fbbf24">
    <rect x="15" y="8"  width="2" height="1"/>
    <rect x="14" y="9"  width="4" height="1"/>
    <rect x="13" y="10" width="6" height="1"/>
    <rect x="14" y="11" width="4" height="1"/>
    <rect x="15" y="12" width="2" height="1"/>
  </g>

  <!-- Tiny sparkle dots flanking the hat -->
  <rect fill="#fbbf24" x="3"  y="8"  width="1" height="1"/>
  <rect fill="#fbbf24" x="28" y="9"  width="1" height="1"/>
  <rect fill="#fbbf24" x="5"  y="13" width="1" height="1"/>
</svg>
