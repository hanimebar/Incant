<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect fill="#0f0a2e" width="32" height="32"/>

  <!-- Hat body: midnight navy, tallest, shifted left to make room for staff -->
  <g fill="#1e1b4b">
    <rect x="10" y="0"  width="2"  height="1"/>
    <rect x="9"  y="1"  width="4"  height="1"/>
    <rect x="8"  y="2"  width="6"  height="1"/>
    <rect x="7"  y="3"  width="8"  height="1"/>
    <rect x="6"  y="4"  width="10" height="1"/>
    <rect x="5"  y="5"  width="12" height="1"/>
    <rect x="4"  y="6"  width="14" height="1"/>
    <rect x="3"  y="7"  width="16" height="1"/>
    <rect x="3"  y="8"  width="16" height="1"/>
    <rect x="2"  y="9"  width="18" height="1"/>
    <rect x="2"  y="10" width="18" height="1"/>
    <rect x="2"  y="11" width="18" height="1"/>
  </g>

  <!-- Hat band -->
  <rect fill="#312e81" x="2" y="12" width="18" height="1"/>

  <!-- Brim: wider, 3 rows tall for a grand wizard look -->
  <rect fill="#312e81" x="0" y="13" width="22" height="3"/>

  <!-- Moon crescent on hat body (gold, C-shape opening right) -->
  <g fill="#f5c518">
    <rect x="8" y="4" width="2" height="1"/>
    <rect x="7" y="5" width="2" height="1"/>
    <rect x="7" y="6" width="2" height="1"/>
    <rect x="8" y="7" width="2" height="1"/>
  </g>
  <!-- Moon hollow (remove inner pixel) -->
  <rect fill="#1e1b4b" x="8" y="5" width="1" height="2"/>

  <!-- Stars scattered on hat (gold) -->
  <g fill="#f5c518">
    <rect x="11" y="2"  width="1" height="1"/>
    <rect x="13" y="4"  width="1" height="1"/>
    <rect x="5"  y="6"  width="1" height="1"/>
    <rect x="15" y="7"  width="1" height="1"/>
    <rect x="4"  y="9"  width="1" height="1"/>
    <rect x="16" y="10" width="1" height="1"/>
    <rect x="3"  y="11" width="1" height="1"/>
  </g>

  <!-- Staff shaft: dark, right side of canvas -->
  <rect fill="#1c1917" x="25" y="4" width="3" height="28"/>

  <!-- Orb at top of staff: glowing indigo -->
  <rect fill="#818cf8" x="23" y="0" width="7" height="4"/>
  <!-- Orb rounded corners (overdraw dark) -->
  <rect fill="#0f0a2e" x="23" y="0" width="1" height="1"/>
  <rect fill="#0f0a2e" x="29" y="0" width="1" height="1"/>
  <rect fill="#0f0a2e" x="23" y="3" width="1" height="1"/>
  <rect fill="#0f0a2e" x="29" y="3" width="1" height="1"/>
  <!-- Orb highlight -->
  <rect fill="#e0e7ff" x="24" y="1" width="2" height="1"/>

  <!-- Floating stars around orb and staff (gold) -->
  <g fill="#f5c518">
    <rect x="21" y="1"  width="1" height="1"/>
    <rect x="31" y="2"  width="1" height="1"/>
    <rect x="22" y="5"  width="1" height="1"/>
    <rect x="31" y="6"  width="1" height="1"/>
    <rect x="30" y="10" width="1" height="1"/>
    <rect x="22" y="12" width="1" height="1"/>
  </g>

  <!-- Cyan sparkles for maximum magic -->
  <g fill="#67e8f9">
    <rect x="20" y="3"  width="1" height="1"/>
    <rect x="31" y="4"  width="1" height="1"/>
    <rect x="29" y="8"  width="1" height="1"/>
  </g>
</svg>
